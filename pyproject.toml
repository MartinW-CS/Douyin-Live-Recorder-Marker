[project]
name = "douyin-live-marker"
version = "0.1.0"
description = "Douyin live recording marker pipeline integrating biliup and dycast."
requires-python = ">=3.12"
dependencies = [
    "websockets>=12",
]

[project.scripts]
douyin-marker = "douyin_live_marker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
