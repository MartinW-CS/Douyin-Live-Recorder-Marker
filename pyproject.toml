[project]
name = "douyin-live-marker"
version = "0.1.0"
description = "Local Douyin live recording helper with danmaku and gift marker generation."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
douyin-marker = "douyin_live_marker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
